<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Gayvelopers private game backend">
  <rect width="1200" height="1500" fill="#0E0F12"/>

  <!-- flat grid, no gradients -->
  <g stroke="#C8F560" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M0 720H1200M0 840H1200M0 960H1200M0 1080H1200M0 1200H1200M0 1320H1200M0 1440H1200"/>
    <path d="M120 0V1500M240 0V1500M360 0V1500M480 0V1500M600 0V1500M720 0V1500M840 0V1500M960 0V1500M1080 0V1500"/>
  </g>

  <!-- oversized cropped mark, top-right -->
  <g transform="translate(800,-90) rotate(-7)">
    <rect width="380" height="380" rx="94" fill="#C8F560" opacity="0.10"/>
    <circle cx="177" cy="196" r="94" fill="none" stroke="#C8F560" stroke-width="44" stroke-opacity="0.5"
            stroke-dasharray="517.1 73.9" stroke-dashoffset="37"/>
    <rect x="177" y="174" width="94" height="44" fill="#C8F560" fill-opacity="0.5"/>
  </g>

  <!-- eyebrow -->
  <text x="96" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="21" font-weight="600" letter-spacing="6.5" fill="#C8F560">PRIVATE GAME BACKEND</text>
  <rect x="96" y="168" width="72" height="4" fill="#C8F560"/>

  <!-- mark + wordmark -->
  <g transform="translate(96,620)">
    <rect width="104" height="104" rx="26" fill="#C8F560"/>
    <circle cx="49" cy="55" r="25" fill="none" stroke="#0E0F12" stroke-width="12"
            stroke-dasharray="137.4 19.6" stroke-dashoffset="9.8"/>
    <rect x="49" y="49" width="25" height="12" fill="#0E0F12"/>
  </g>
  <text x="232" y="702" font-family="'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif"
        font-size="78" font-weight="800" letter-spacing="-2.6" fill="#F1F1EC">Gayvelopers</text>
  <text x="96" y="790" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="24" font-weight="500" letter-spacing="0.6" fill="#8A8B93">Nakama 3.42 · private server</text>

  <!-- flat feature chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="600" letter-spacing="2.2">
    <rect x="96" y="880" width="300" height="72" rx="16" fill="#16181D" stroke="#272A31"/>
    <text x="124" y="925" fill="#C8F560">ACCOUNTS</text>

    <rect x="96" y="972" width="300" height="72" rx="16" fill="#16181D" stroke="#272A31"/>
    <text x="124" y="1017" fill="#C8F560">LEADERBOARDS</text>

    <rect x="96" y="1064" width="300" height="72" rx="16" fill="#16181D" stroke="#272A31"/>
    <text x="124" y="1109" fill="#C8F560">STORAGE</text>
  </g>

  <!-- footer ticks -->
  <g fill="#C8F560" opacity="0.9">
    <rect x="96" y="1392" width="46" height="6"/>
    <rect x="154" y="1392" width="46" height="6" opacity="0.55"/>
    <rect x="212" y="1392" width="46" height="6" opacity="0.25"/>
  </g>
</svg>
