# Gayvelopers console branding for Nakama — nginx snippet.
#
# Paste BOTH parts into the server block that serves the console
# (the one with `proxy_pass http://127.0.0.1:7351;`), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bump the ?v= numbers whenever brand.css / brand.js change.

# ---- inside  location / { ... }  -------------------------------------------
# Nakama gzips the SPA HTML and sub_filter cannot touch a compressed body.
    proxy_set_header Accept-Encoding "";

    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '<title>Nakama</title>' '<title>Gayvelopers · Nakama Console</title>';
    sub_filter '</head>' '<link rel="stylesheet" href="/branding/brand.css?v=4"><script src="/branding/brand.js?v=3" defer></script></head>';

# ---- sibling of  location / { ... }  ---------------------------------------
    location /branding/ {
        alias /var/www/nakama-branding/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
